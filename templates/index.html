<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Search and watch YouTube videos without injected ads.">
    <title>YouTube without ads</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="shell shell--home">
        <section class="hero" aria-labelledby="site-title">
            <p class="eyebrow">Private, focused playback</p>
            <h1 id="site-title">YouTube <span>without ads</span></h1>
            <p class="lede">Search for a video and watch it in a lightweight player with selectable quality.</p>
            <form class="search-form" action="{{ url_for('search') }}" method="get">
                <label class="sr-only" for="query">Search for a video</label>
                <input id="query" name="q" type="search" placeholder="Search YouTube…" maxlength="200"
                       autocomplete="off" required autofocus>
                <button type="submit">Search</button>
            </form>
            <p class="hint">No account required. Search terms are sent to YouTube through yt-dlp.</p>
        </section>
    </main>
</body>
</html>
